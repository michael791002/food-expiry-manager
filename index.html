function extractDateCandidates(text, options = {}) {
  const strictOcrYear = !!options.strictOcrYear;
  const candidates = [];

  const MONTHS = {
    JAN:1,JANUARY:1,
    FEB:2,FEBRUARY:2,
    MAR:3,MARCH:3,
    APR:4,APRIL:4,
    MAY:5,
    JUN:6,JUNE:6,
    JUL:7,JULY:7,
    AUG:8,AUGUST:8,
    SEP:9,SEPT:9,SEPTEMBER:9,
    OCT:10,OCTOBER:10,
    NOV:11,NOVEMBER:11,
    DEC:12,DECEMBER:12
  };

  const MONTH_TOKEN =
    '(?:JAN(?:UARY)?|FEB(?:RUARY)?|MAR(?:CH)?|APR(?:IL)?|MAY|JUN(?:E)?|JUL(?:Y)?|AUG(?:UST)?|SEP(?:T(?:EMBER)?)?|OCT(?:OBER)?|NOV(?:EMBER)?|DEC(?:EMBER)?)';

  // 「保存期限 / Shelf Life」刻意不放在有效日期關鍵字內，
  // 因為「保存期限 12 個月」只是期間，不是日期。
  const expiryKeywordRe =
    /(有效日期|有效期限|賞味期限|消費期限|到期日|EXP(?:IRY|IRES|IRATION)?(?:\s*DATE)?|EXP\s*DATE|USE\s*(?:BY|BEFORE)|BEST\s*(?:IF\s*)?(?:BEFORE|USED\s+BY)|BEST\s+BY|SELL\s+BY|\bBB\b|\bBBD\b|\bBBE\b)/i;

  const manufactureKeywordRe =
    /(製造日期|製造日|生產日期|生産日|\bMFG\b|\bMFD\b|\bMD\b|MFG\s*DATE|MANUFACTURED|\bPROD\b|PROD\s*DATE|PRODUCTION\s*DATE|\bP\.?\s*D\.?\b)/i;

  const lotBatchKeywordRe =
    /(批號|\bLOT(?:\s*(?:NO|NO\.|NUMBER))?\b|\bBATCH(?:\s*(?:NO|NO\.|NUMBER))?\b)/i;

  const endOfMonthRe =
    /(BEST\s+BEFORE\s+END|END\s+OF\s+(?:MONTH|[A-Z]{3,9})|\bBBE\b)/i;

  const dmyHintRe =
    /(DD\s*MM\s*(?:YYYY|YY)|DD[\/\-.]MM[\/\-.](?:YYYY|YY)|DD\s*MMM\s*(?:YYYY|YY)|日\s*[\/\-.]?\s*月\s*[\/\-.]?\s*年)/i;

  const mdyHintRe =
    /(MM\s*DD\s*(?:YYYY|YY)|MM[\/\-.]DD[\/\-.](?:YYYY|YY)|MMM\s*DD\s*(?:YYYY|YY))/i;

  const ymdHintRe =
    /((?:YYYY|YY)\s*MM\s*DD|(?:YYYY|YY)[\/\-.]MM[\/\-.]DD)/i;

  function monthNumber(token) {
    return MONTHS[String(token || '')
      .toUpperCase()
      .replace(/\.$/,'')] || null;
  }

  function normalizeYear(y) {
    y = Number(y);

    if (!Number.isFinite(y)) return null;

    if (y < 100) {
      return y <= 69 ? 2000 + y : 1900 + y;
    }

    // 民國年
    if (y >= 100 && y <= 199) {
      return y + 1911;
    }

    return y;
  }

  function validDate(y,m,d) {
    const dt = new Date(y,m-1,d);

    return (
      dt.getFullYear() === y &&
      dt.getMonth() === m-1 &&
      dt.getDate() === d
    );
  }

  function lastDayOfMonth(y,m) {
    return new Date(y,m,0).getDate();
  }

  function localContext(lines,index) {
    return [
      lines[index-1] || '',
      lines[index] || ''
    ].join(' ');
  }

  function compactNearbyContext(line, matchIndex, matchText) {
    const left = Math.max(0, matchIndex - 18);
    const right = Math.min(
      line.length,
      matchIndex + String(matchText || '').length + 10
    );

    return line.slice(left,right);
  }

  function contextScore(context) {
    let score = 0;

    if (expiryKeywordRe.test(context)) score += 9;

    if (
      manufactureKeywordRe.test(context) &&
      !expiryKeywordRe.test(context)
    ) {
      score -= 12;
    }

    if (
      lotBatchKeywordRe.test(context) &&
      !expiryKeywordRe.test(context)
    ) {
      score -= 18;
    }

    return score;
  }

  function shouldSkipCompact(context) {
    return (
      lotBatchKeywordRe.test(context) &&
      !expiryKeywordRe.test(context)
    );
  }

  function addYMD(
    y,m,d,
    source,
    score=0,
    {
      note='',
      format='',
      context=''
    }={}
  ) {
    y = normalizeYear(y);
    m = Number(m);
    d = Number(d);

    if (y === null) return false;
    if (y < 2000 || y > 2100) return false;
    if (m < 1 || m > 12) return false;
    if (d < 1 || d > 31) return false;
    if (!validDate(y,m,d)) return false;

    const iso =
      `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    const existing = candidates.find(x => x.iso === iso);

    if (existing) {
      if (score > existing.score) {
        existing.score = score;
        existing.source = source;
      }

      if (note) {
        const notes = new Set(existing.notes || []);
        notes.add(note);
        existing.notes = [...notes];
        existing.note = existing.notes.join('；');
      }

      if (format) {
        const formats = new Set(existing.formats || []);
        formats.add(format);
        existing.formats = [...formats];
        existing.format = existing.formats.join(', ');
      }

      return true;
    }

    candidates.push({
      iso,
      source,
      score,
      note,
      notes:note ? [note] : [],
      format,
      formats:format ? [format] : []
    });

    return true;
  }

  function addMonthPrecision(
    y,m,
    source,
    score,
    {
      note='',
      format='',
      context='',
      endOfMonth=false
    }={}
  ) {
    y = normalizeYear(y);
    m = Number(m);

    if (y === null || y < 2000 || y > 2100) return false;
    if (m < 1 || m > 12) return false;

    const day = endOfMonth
      ? lastDayOfMonth(y,m)
      : 1;

    const baseNote = endOfMonth
      ? '原標示只有年 / 月，但包裝明確標示月底期限，已換算為該月最後一天'
      : '原標示只有年 / 月，已用該月 1 日作為候選';

    return addYMD(
      y,m,day,
      source,
      score,
      {
        note:note
          ? `${baseNote}；${note}`
          : baseNote,
        format,
        context
      }
    );
  }

  function addAmbiguousPossibilities(possibilities, {
    source,
    baseScore,
    context,
    ambiguityNote
  }) {
    const valid = [];

    for (const p of possibilities) {
      const y = normalizeYear(p.y);
      const m = Number(p.m);
      const d = Number(p.d);

      if (
        y !== null &&
        y >= 2000 && y <= 2100 &&
        m >= 1 && m <= 12 &&
        d >= 1 && d <= 31 &&
        validDate(y,m,d)
      ) {
        valid.push({...p,y,m,d});
      }
    }

    // 去除同日期但不同格式的重複。
    const uniqueIso = new Set(
      valid.map(p =>
        `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`
      )
    );

    for (const p of valid) {
      let extra = Number(p.scoreBoost || 0);
      let note = p.note || '';

      if (uniqueIso.size > 1) {
        note = note
          ? `${ambiguityNote}；${note}`
          : ambiguityNote;
      }

      addYMD(
        p.y,p.m,p.d,
        source,
        baseScore + extra,
        {
          format:p.format,
          note,
          context
        }
      );
    }
  }

  function addNumericDmyMdy(a,b,y,source,baseScore,context) {
    a=Number(a);
    b=Number(b);
    y=Number(y);

    const hintedDmy =
      dmyHintRe.test(context) || dmyHintRe.test(text);
    const hintedMdy =
      mdyHintRe.test(context) || mdyHintRe.test(text);

    const possibilities = [
      {
        y,m:b,d:a,
        format:'DD/MM/YYYY',
        scoreBoost:hintedDmy ? 5 : 0
      },
      {
        y,m:a,d:b,
        format:'MM/DD/YYYY',
        scoreBoost:hintedMdy ? 5 : 0
      }
    ];

    addAmbiguousPossibilities(
      possibilities,
      {
        source,
        baseScore,
        context,
        ambiguityNote:
          '日期格式有歧義，請確認是 DD/MM/YYYY 還是 MM/DD/YYYY'
      }
    );
  }

  function addThreePartShort(a,b,c,source,baseScore,context) {
    if (strictOcrYear) return;

    const hintedDmy =
      dmyHintRe.test(context) || dmyHintRe.test(text);
    const hintedMdy =
      mdyHintRe.test(context) || mdyHintRe.test(text);
    const hintedYmd =
      ymdHintRe.test(context) || ymdHintRe.test(text);

    addAmbiguousPossibilities(
      [
        {
          y:a,m:b,d:c,
          format:'YY/MM/DD',
          scoreBoost:hintedYmd ? 5 : 0
        },
        {
          y:c,m:b,d:a,
          format:'DD/MM/YY',
          scoreBoost:hintedDmy ? 5 : 0
        },
        {
          y:c,m:a,d:b,
          format:'MM/DD/YY',
          scoreBoost:hintedMdy ? 5 : 0
        }
      ],
      {
        source,
        baseScore,
        context,
        ambiguityNote:
          '三段兩位數日期格式有歧義，已列出所有合法解釋'
      }
    );
  }

  function addCompact8(token,source,baseScore,context) {
    if (!/^\d{8}$/.test(token)) return;

    const possibilities = [];

    const y1 = Number(token.slice(0,4));
    if (y1 >= 2000 && y1 <= 2100) {
      possibilities.push({
        y:y1,
        m:Number(token.slice(4,6)),
        d:Number(token.slice(6,8)),
        format:'YYYYMMDD',
        scoreBoost:ymdHintRe.test(context) ? 4 : 0
      });
    }

    const y2 = Number(token.slice(4,8));
    if (y2 >= 2000 && y2 <= 2100) {
      possibilities.push({
        y:y2,
        m:Number(token.slice(2,4)),
        d:Number(token.slice(0,2)),
        format:'DDMMYYYY',
        scoreBoost:dmyHintRe.test(context) ? 4 : 0
      });

      possibilities.push({
        y:y2,
        m:Number(token.slice(0,2)),
        d:Number(token.slice(2,4)),
        format:'MMDDYYYY',
        scoreBoost:mdyHintRe.test(context) ? 4 : 0
      });
    }

    addAmbiguousPossibilities(
      possibilities,
      {
        source,
        baseScore,
        context,
        ambiguityNote:
          '8 碼日期格式有歧義，已列出所有合法解釋'
      }
    );
  }

  function addCompact6(token,source,baseScore,context) {
    if (strictOcrYear) return;
    if (!/^\d{6}$/.test(token)) return;

    const possibilities = [
      {
        y:Number(token.slice(0,2)),
        m:Number(token.slice(2,4)),
        d:Number(token.slice(4,6)),
        format:'YYMMDD',
        scoreBoost:ymdHintRe.test(context) ? 4 : 0
      },
      {
        y:Number(token.slice(4,6)),
        m:Number(token.slice(2,4)),
        d:Number(token.slice(0,2)),
        format:'DDMMYY',
        scoreBoost:dmyHintRe.test(context) ? 4 : 0
      },
      {
        y:Number(token.slice(4,6)),
        m:Number(token.slice(0,2)),
        d:Number(token.slice(2,4)),
        format:'MMDDYY',
        scoreBoost:mdyHintRe.test(context) ? 4 : 0
      }
    ];

    // 6 碼也可能是只有年/月：YYYYMM 或 MMYYYY。
    const monthCandidates = [];

    const yFirst = Number(token.slice(0,4));
    const mLast = Number(token.slice(4,6));
    if (
      yFirst >= 2000 && yFirst <= 2100 &&
      mLast >= 1 && mLast <= 12
    ) {
      monthCandidates.push({
        y:yFirst,
        m:mLast,
        format:'YYYYMM'
      });
    }

    const mFirst = Number(token.slice(0,2));
    const yLast = Number(token.slice(2,6));
    if (
      yLast >= 2000 && yLast <= 2100 &&
      mFirst >= 1 && mFirst <= 12
    ) {
      monthCandidates.push({
        y:yLast,
        m:mFirst,
        format:'MMYYYY'
      });
    }

    // 先確認完整日期有幾種合法解釋。
    const validDateIsos = new Set();
    for (const p of possibilities) {
      const y = normalizeYear(p.y);
      const m = Number(p.m);
      const d = Number(p.d);

      if (
        y !== null &&
        y >= 2000 && y <= 2100 &&
        m >= 1 && m <= 12 &&
        d >= 1 && d <= 31 &&
        validDate(y,m,d)
      ) {
        validDateIsos.add(
          `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`
        );
      }
    }

    const totalInterpretations =
      validDateIsos.size + monthCandidates.length;

    addAmbiguousPossibilities(
      possibilities,
      {
        source,
        baseScore,
        context,
        ambiguityNote:
          '6 碼日期格式有歧義，已列出所有合法解釋'
      }
    );

    for (const p of monthCandidates) {
      addMonthPrecision(
        p.y,p.m,
        source,
        baseScore - 1,
        {
          format:p.format,
          note:
            totalInterpretations > 1
              ? '6 碼內容也可能代表完整日期，請與其他候選一起確認'
              : '',
          context,
          endOfMonth:endOfMonthRe.test(context)
        }
      );
    }
  }

  const lines = String(text || '')
    .replace(/\u00A0/g,' ')
    .split(/\r?\n/);

  for (let i=0;i<lines.length;i++) {
    const line = lines[i];
    const previousLine = lines[i-1] || '';
    const context = localContext(lines,i);

    // 同一行的標籤優先，避免：
    // MFG 日期下一行剛好是 EXP 日期時，兩行互相污染權重。
    const ownScore = contextScore(line);
    const cScore =
      ownScore !== 0
        ? ownScore
        : contextScore(previousLine);

    let m;

    // 1) YYYY.MM.DD / YYYY-MM-DD / YYYY/MM/DD / YYYY年MM月DD日
    {
      const re =
        /\b(20\d{2})\s*[年\/\-.]\s*(\d{1,2})\s*[月\/\-.]\s*(\d{1,2})\s*日?\b/g;

      while ((m = re.exec(line))) {
        addYMD(
          m[1],m[2],m[3],
          line.trim(),
          8 + cScore,
          {
            format:'YYYY/MM/DD',
            context
          }
        );
      }
    }

    // 2) 民國：民國115年10月3日 / ROC 115/10/03 / 115/10/03
    {
      const re =
        /(?:民國|ROC\s*)?(\d{3})\s*[年\/\-.]\s*(\d{1,2})\s*[月\/\-.]\s*(\d{1,2})\s*日?/gi;

      while ((m = re.exec(line))) {
        const roc = Number(m[1]);

        if (roc >= 100 && roc <= 199) {
          addYMD(
            roc,m[2],m[3],
            line.trim(),
            7 + cScore,
            {
              format:'ROC YYY/MM/DD',
              note:'民國年已轉換為西元',
              context
            }
          );
        }
      }
    }

    // 3) DD/MM/YYYY 或 MM/DD/YYYY；兩者都合法時全列。
    {
      const re =
        /\b(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(20\d{2})\b/g;

      while ((m = re.exec(line))) {
        addNumericDmyMdy(
          m[1],m[2],m[3],
          line.trim(),
          6 + cScore,
          context
        );
      }
    }

    // 4) 三段兩位數：
    //    YY/MM/DD、DD/MM/YY、MM/DD/YY 都嘗試；
    //    有多種合法日期時全部列出。
    {
      const re =
        /\b(\d{2})\s*[\/\-.]\s*(\d{2})\s*[\/\-.]\s*(\d{2})\b/g;

      while ((m = re.exec(line))) {
        addThreePartShort(
          m[1],m[2],m[3],
          line.trim(),
          4 + cScore,
          context
        );
      }
    }

    // 5) DD MMM YYYY / DD-MMM-YY
    {
      const re = new RegExp(
        '\\b(\\d{1,2})\\s*[-./ ]\\s*(' +
        MONTH_TOKEN +
        ')\\.?\\s*[-./ ,]?\\s*(20\\d{2}|\\d{2})\\b(?!\\s*:\\s*\\d)',
        'gi'
      );

      while ((m = re.exec(line))) {
        addYMD(
          m[3],monthNumber(m[2]),m[1],
          line.trim(),
          9 + cScore,
          {
            format:'DD MMM YYYY',
            context
          }
        );
      }
    }

    // 6) MMM DD YYYY / MMM DD YY
    //    日與年份之間必須真的有分隔，避免把 "SEP 2026"
    //    拆成 "SEP 20 26"。
    {
      const re = new RegExp(
        '\\b(' + MONTH_TOKEN +
        ')\\.?\\s+([0-3]?\\d)(?:st|nd|rd|th)?(?:\\s*[,./-]\\s*|\\s+)(20\\d{2}|\\d{2})\\b',
        'gi'
      );

      while ((m = re.exec(line))) {
        addYMD(
          m[3],monthNumber(m[1]),m[2],
          line.trim(),
          9 + cScore,
          {
            format:'MMM DD YYYY',
            context
          }
        );
      }
    }

    // 7) YYYY MMM DD
    {
      const re = new RegExp(
        '\\b(20\\d{2})\\s*[-./ ]\\s*(' +
        MONTH_TOKEN +
        ')\\.?\\s*[-./ ]\\s*(\\d{1,2})\\b',
        'gi'
      );

      while ((m = re.exec(line))) {
        addYMD(
          m[1],monthNumber(m[2]),m[3],
          line.trim(),
          8 + cScore,
          {
            format:'YYYY MMM DD',
            context
          }
        );
      }
    }

    // 8) 英文月份 + 年份：SEP 2026 / SEP 26
    //    預設用該月 1 日；只有明確 END 才用月底。
    {
      // 四位年份
      const re4 = new RegExp(
        '\\b(' + MONTH_TOKEN + ')\\.?\\s+(20\\d{2})\\b',
        'gi'
      );

      while ((m = re4.exec(line))) {
        // "30 SEP 2026" 是完整日月年，不再額外產生 SEP 2026。
        const before = line.slice(0,m.index);

        if (/\d{1,2}\s*[-./ ]\s*$/i.test(before)) {
          continue;
        }

        addMonthPrecision(
          m[2],
          monthNumber(m[1]),
          line.trim(),
          6 + cScore,
          {
            format:'MMM YYYY',
            context,
            endOfMonth:endOfMonthRe.test(context)
          }
        );
      }

      // 兩位年份
      const re2 = new RegExp(
        '\\b(' + MONTH_TOKEN + ')\\.?\\s+(\\d{2})\\b',
        'gi'
      );

      while ((m = re2.exec(line))) {
        const before = line.slice(0,m.index);
        const after = line.slice(
          m.index + m[0].length
        );

        // "30 SEP 26" 是完整日期。
        if (/\d{1,2}\s*[-./ ]\s*$/i.test(before)) {
          continue;
        }

        // "SEP 30 2026" 中的 SEP 30 不是 SEP 2030。
        if (/^\s*[,./-]?\s*\d/.test(after)) {
          continue;
        }

        // "MAR 15:31" 的 15 是時間，不是 2015。
        if (/^\s*:\s*\d/.test(after)) {
          continue;
        }

        addMonthPrecision(
          m[2],
          monthNumber(m[1]),
          line.trim(),
          5 + cScore,
          {
            format:'MMM YY',
            note:'月份 + 兩位年份格式，請確認兩位數確實代表年份',
            context,
            endOfMonth:endOfMonthRe.test(context)
          }
        );
      }
    }

    // 9) YYYY MMM：2026 SEP
    {
      const re = new RegExp(
        '\\b(20\\d{2})\\s+(' + MONTH_TOKEN + ')\\.?\\b',
        'gi'
      );

      while ((m = re.exec(line))) {
        const after = line.slice(
          m.index + m[0].length
        );

        if (/^\s*[-./ ]\s*\d/.test(after)) {
          continue;
        }

        addMonthPrecision(
          m[1],
          monthNumber(m[2]),
          line.trim(),
          6 + cScore,
          {
            format:'YYYY MMM',
            context,
            endOfMonth:endOfMonthRe.test(context)
          }
        );
      }
    }

    // 10) YYYY/MM、YYYY-MM、YYYY.MM
    //     避免從完整 YYYY/MM/DD 裡再切出年月。
    {
      const re =
        /(?:^|[^0-9\/\-.])(20\d{2})\s*[\/\-.]\s*(0?[1-9]|1[0-2])(?!\s*[\/\-.]\s*\d)/g;

      while ((m = re.exec(line))) {
        addMonthPrecision(
          m[1],m[2],
          line.trim(),
          6 + cScore,
          {
            format:'YYYY/MM',
            context,
            endOfMonth:endOfMonthRe.test(context)
          }
        );
      }
    }

    // 11) MM/YYYY、MM-YYYY、MM.YYYY
    //     避免抓到 DD/MM/YYYY 中間的 MM/YYYY。
    {
      const re =
        /(?:^|[^0-9\/\-.])(0?[1-9]|1[0-2])\s*[\/\-.]\s*(20\d{2})(?!\s*[\/\-.]\s*\d)/g;

      while ((m = re.exec(line))) {
        addMonthPrecision(
          m[2],m[1],
          line.trim(),
          6 + cScore,
          {
            format:'MM/YYYY',
            context,
            endOfMonth:endOfMonthRe.test(context)
          }
        );
      }
    }

    // 12) MM/YY（例如 09/26）：
    //     單獨年月格式，使用該月 1 日。
    {
      const re =
        /(?:^|[^0-9\/\-.])(0?[1-9]|1[0-2])\s*[\/\-.]\s*(\d{2})(?!\d)(?!\s*[\/\-.]\s*\d)/g;

      while ((m = re.exec(line))) {
        addMonthPrecision(
          m[2],m[1],
          line.trim(),
          4 + cScore,
          {
            format:'MM/YY',
            note:'兩位年份格式，請確認年份',
            context,
            endOfMonth:endOfMonthRe.test(context)
          }
        );
      }
    }

    // 13) 民國連續 7 碼：1150930
    {
      const re = /(?:^|[^0-9])(\d{7})(?!\d)/g;

      while ((m = re.exec(line))) {
        const token = m[1];
        const roc = Number(token.slice(0,3));
        const near = compactNearbyContext(
          line,
          m.index,
          m[0]
        );

        if (shouldSkipCompact(near)) continue;

        if (roc >= 100 && roc <= 199) {
          addYMD(
            roc,
            Number(token.slice(3,5)),
            Number(token.slice(5,7)),
            line.trim(),
            6 + contextScore(near),
            {
              format:'ROC YYYMMDD',
              note:'民國連續日期已轉換為西元',
              context:near
            }
          );
        }
      }
    }

    // 14) 8 碼：YYYYMMDD / DDMMYYYY / MMDDYYYY
    {
      const re = /(?:^|[^0-9])(\d{8})(?!\d)/g;

      while ((m = re.exec(line))) {
        const near = compactNearbyContext(
          line,
          m.index,
          m[0]
        );

        if (shouldSkipCompact(near)) continue;

        addCompact8(
          m[1],
          line.trim(),
          5 + contextScore(near),
          near
        );
      }
    }

    // 15) 6 碼：
    //     YYMMDD / DDMMYY / MMDDYY / YYYYMM / MMYYYY
    {
      const re = /(?:^|[^0-9])(\d{6})(?!\d)/g;

      while ((m = re.exec(line))) {
        const near = compactNearbyContext(
          line,
          m.index,
          m[0]
        );

        if (shouldSkipCompact(near)) continue;

        addCompact6(
          m[1],
          line.trim(),
          4 + contextScore(near),
          near
        );
      }
    }

    // 16) OCR 把 YYYY/MM/DD 分隔符吃成空白：YYYY MM DD
    {
      const re =
        /\b(20\d{2})\s+(\d{1,2})\s+(\d{1,2})\b/g;

      while ((m = re.exec(line))) {
        addYMD(
          m[1],m[2],m[3],
          line.trim(),
          3 + cScore,
          {
            format:'YYYY MM DD',
            note:'OCR 可能漏掉日期分隔符',
            context
          }
        );
      }
    }
  }

  candidates.sort((a,b) =>
    b.score - a.score ||
    a.iso.localeCompare(b.iso)
  );

  return candidates;
}

function renderOcrCandidates() {
  const box = $('ocrCandidateList');

  if (!ocrCandidates.length) {
    box.innerHTML = '<div class="small">沒有找到日期候選。</div>';
    $('ocrApplyBtn').disabled = true;
    return;
  }

  box.innerHTML = ocrCandidates.map((c,i)=>`
    <label class="ocr-candidate">
      <input type="radio" name="ocrCandidate" value="${c.iso}" ${i===0?'checked':''}>
      <div>
        <b>${c.iso}</b>
        <div class="small">${escapeHtml(c.source || '')}</div>
      </div>
    </label>
  `).join('');

  $('ocrApplyBtn').disabled = false;
}

$('ocrApplyBtn').onclick = () => {
  const selected = document.querySelector('input[name="ocrCandidate"]:checked');

  if (!selected) {
    setStatus('ocrStatus','請先選擇一個日期。','err');
    return;
  }

  $('expiry').value = selected.value;
  $('ocrDialog').close();
  setStatus('foodStatus',`已套用掃描日期：${selected.value}`,'ok');
};



// -------- 記住上一次登入 Email --------

function restoreLastLoginEmail() {
  const lastEmail = localStorage.getItem(LAST_EMAIL_KEY) || '';

  if (lastEmail && !$('loginEmail').value) {
    $('loginEmail').value = lastEmail;
  }
}

restoreLastLoginEmail();

ensureOcrServiceWorker().then(() => {
  refreshOcrOfflineStatus();
});

restoreSession();
</script>
