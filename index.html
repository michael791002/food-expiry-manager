<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食品過期管理 v4.4</title>
<style>
:root {
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#1f2937;background:#f3f6f9;
}
*{box-sizing:border-box}
body{margin:0;padding:22px}
.app{max-width:1180px;margin:auto}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06);margin-bottom:16px}
h1,h2,h3{margin-top:0}
.sub,.small,.status{color:#667085}
.small{font-size:12px;line-height:1.55}
label{display:block;font-size:13px;color:#667085;margin:11px 0 5px}
input,select,textarea,button{width:100%;font:inherit;border-radius:10px;border:1px solid #d6dce5;padding:11px 12px}
button{border:0;background:#1686a7;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#667085}
button.ghost{background:#eef4f7;color:#315c69}
button.danger{background:#c74747}
button.warn{background:#b7781d}
button.linkbtn{background:transparent;color:#1686a7;padding:6px 0;width:auto;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth{max-width:520px;margin:50px auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{width:auto}
.active{background:#1686a7!important;color:#fff!important}
.inactive{background:#eef4f7!important;color:#315c69!important}
.status{min-height:20px;margin-top:10px;font-size:13px;line-height:1.5}
.ok{color:#227a43}
.err{color:#b63737}
.topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topbar button,.topbar select{width:auto}
.layout{display:grid;grid-template-columns:350px 1fr;gap:18px}
.food{border:1px solid #e6e9ee;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}
.food.pending{border-style:dashed;background:#fffdf8}
.food-title{font-size:17px;font-weight:800}
.meta{font-size:13px;color:#667085;line-height:1.5;margin-top:4px}
.actions{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.actions button{width:auto;padding:7px 9px;font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;margin-top:6px}
.badge.ok{background:#e9f7ef}
.badge.warn{background:#fff5dd;color:#9a6414}
.badge.danger{background:#fdecec;color:#b63737}
.familybox{background:#f8fafc;border-radius:12px;padding:12px}
.code{font-family:ui-monospace,monospace;font-size:20px;font-weight:800;letter-spacing:1px}
.empty{text-align:center;color:#98a2b3;padding:35px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calendar-head button{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;color:#667085;padding:6px}
.day{min-height:92px;border:1px solid #e6e9ee;border-radius:10px;padding:7px}
.day.muted{background:#fafafa;color:#bbb}
.num{font-size:12px;color:#667085}
.event{font-size:11px;background:#e9f6fa;color:#205c6d;border-radius:6px;padding:4px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
.splash{max-width:520px;margin:70px auto;text-align:center}
.spinner{width:32px;height:32px;border:4px solid #e5e7eb;border-top-color:#1686a7;border-radius:50%;margin:18px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.authlinks{display:flex;justify-content:flex-end;margin-top:6px}
.codeinput{letter-spacing:4px;font-weight:800;text-align:center;font-size:20px}
.syncbar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.syncdot{width:9px;height:9px;border-radius:50%;background:#98a2b3}
.syncdot.dirty{background:#d18a22}
.syncdot.syncing{background:#1686a7}
.syncdot.synced{background:#26955a}
.member{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.member:last-child{border-bottom:0}
.member .who{min-width:0}
.member .email{font-size:12px;color:#667085;overflow:hidden;text-overflow:ellipsis}
.member select,.member button{margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar button{width:auto}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 30px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.modal{padding:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions button{width:auto}
.sectionline{height:1px;background:#eceff3;margin:18px 0}
.danger-zone{border:1px solid #f0c4c4;background:#fff8f8;border-radius:12px;padding:14px}
.notify-group{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}
.notify-group-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.notify-group-head input{width:auto}
.notify-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.notify-inline{display:flex;gap:8px;align-items:center}
.notify-inline input{width:auto}
@media(max-width:600px){.notify-grid{grid-template-columns:1fr}}
.ocr-preview-wrap{position:relative;margin-top:12px;background:#111;border-radius:12px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center}
#ocrCanvas{display:block;max-width:100%;height:auto;touch-action:none;cursor:crosshair}
.ocr-help{font-size:12px;color:#667085;line-height:1.5;margin-top:8px}
.ocr-dropzone{
  border:2px dashed #c8d3dc;
  border-radius:12px;
  padding:18px;
  text-align:center;
  color:#667085;
  background:#f8fafc;
  margin-top:10px;
  transition:.15s;
}
.ocr-dropzone.dragover{
  border-color:#1686a7;
  background:#eef8fb;
}
.ocr-dropzone strong{display:block;color:#315c69;margin-bottom:4px}
.ocr-source-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ocr-source-buttons button{width:auto;flex:1}
.ocr-file-input{display:none}
.ocr-mobile-only{display:none}
.ocr-desktop-only{display:flex}
@media (hover:none) and (pointer:coarse){
  .ocr-mobile-only{display:flex}
  .ocr-desktop-only{display:none}
}
.ocr-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ocr-toolbar button{width:auto}
.ocr-results{margin-top:14px}
.ocr-candidate{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px;cursor:pointer}
.ocr-candidate input{width:auto}
.ocr-text{white-space:pre-wrap;background:#f8fafc;border-radius:10px;padding:10px;font-size:12px;color:#475467;max-height:140px;overflow:auto;margin-top:10px}
.ocr-confidence{font-size:12px;font-weight:700}
.ocr-confidence.high{color:#227a43}
.ocr-confidence.mid{color:#9a6414}
.ocr-confidence.low{color:#b63737}
.ocr-debug-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-top:10px;
}
.ocr-debug-card{
  border:1px solid #e4e7ec;
  border-radius:10px;
  padding:8px;
  background:#fff;
}
.ocr-debug-card .small{
  margin-bottom:6px;
  font-weight:700;
}
.ocr-debug-card canvas,
.ocr-debug-card img{
  width:100%;
  height:auto;
  display:block;
  background:#fff;
  border-radius:6px;
  image-rendering:auto;
}


.ocr-progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px}
.ocr-progress > div{height:100%;width:0%;background:#1686a7;transition:width .2s}
.scan-note{font-size:12px;color:#667085;margin-top:8px}

.family-loading{text-align:center;padding:34px 10px}
.family-loading .spinner{margin:0 auto 14px}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
  .day{min-height:70px}
  .member{grid-template-columns:1fr}
}

.ocr-offline-box{
  margin:0 0 14px;
  border:1px solid #d6e6eb;
  border-radius:12px;
  padding:12px;
  background:#f7fbfc;
}
.ocr-offline-row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}
.ocr-offline-title{font-weight:800;color:#245361}
.ocr-offline-status{font-size:13px;color:#667085;margin-top:4px;line-height:1.45}
.ocr-offline-status.ok{color:#227a43}
.ocr-offline-status.warn{color:#9a6414}
.ocr-offline-status.err{color:#b63737}
.ocr-offline-progress{
  height:7px;
  background:#e6eef1;
  border-radius:999px;
  overflow:hidden;
  margin-top:9px;
}
.ocr-offline-progress>div{
  height:100%;
  width:0;
  background:#1686a7;
  transition:width .2s;
}



</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div class="app" data-build="v4.4">

<section id="splash" class="card splash hidden">
  <h1>食品過期管理</h1>
  <div class="spinner"></div>
  <div id="splashText" class="sub">正在恢復登入狀態…</div>
</section>

<section id="authCard" class="card auth">
  <h1>食品過期管理</h1>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">登入</button>
    <button id="registerTab" class="inactive" type="button">建立帳號</button>
  </div>

  <form id="loginForm">
    <div id="loginPane">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" name="username" type="email" inputmode="email" autocomplete="username" required>

      <label for="loginPassword">密碼</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>

      <div class="authlinks">
        <button id="forgotBtn" class="linkbtn" type="button">忘記密碼？</button>
      </div>

      <button id="loginBtn" type="submit" style="margin-top:8px">登入</button>
    </div>
  </form>

  <form id="registerForm" class="hidden">
    <div id="registerPane">
      <label for="regName">顯示名稱</label>
      <input id="regName" name="name" autocomplete="name" placeholder="例如：小明" required>

      <label for="regEmail">Email</label>
      <input id="regEmail" name="email" type="email" inputmode="email" autocomplete="email" required>

      <label for="regPassword">密碼（至少 8 碼）</label>
      <input id="regPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" required>

      <button id="registerBtn" type="submit" style="margin-top:12px">建立帳號</button>
    </div>
  </form>

  <div id="forgotPane" class="hidden">
    <h3>重設密碼</h3>

    <div id="forgotStep1">
      <label for="forgotEmail">註冊 Email</label>
      <input id="forgotEmail" type="email" inputmode="email" autocomplete="email">
      <button id="sendResetCodeBtn" type="button" style="margin-top:12px">寄送 6 位數驗證碼</button>
    </div>

    <div id="forgotStep2" class="hidden">
      <label for="resetCode">6 位數驗證碼</label>
      <input id="resetCode" class="codeinput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">

      <label for="newPassword">新密碼（至少 8 碼）</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8">

      <button id="resetPasswordBtn" type="button" style="margin-top:12px">設定新密碼</button>
    </div>

    <button id="backToLoginBtn" class="linkbtn" type="button" style="margin-top:12px">← 回登入</button>
  </div>

  <div id="authStatus" class="status"></div>
</section>

<section id="mainApp" class="hidden">
  <div class="topbar">
    <div>
      <h1 style="margin-bottom:3px">食品過期管理</h1>
      <div id="hello" class="sub"></div>
    </div>

    <div class="right">
      <div class="syncbar">
        <span id="syncDot" class="syncdot synced"></span>
        <span id="syncText" class="small">已同步</span>
        <button id="syncNowBtn" class="ghost" type="button">立即同步</button>
      </div>

      <select id="familySelect"></select>
      <button id="groupAddBtn" class="ghost" type="button">新增 / 加入群組</button>
      <button id="familyManageBtn" class="ghost" type="button">群組設定</button>
      <button id="notificationBtn" class="ghost" type="button">提醒設定</button>
      <button id="logoutBtn" class="secondary" type="button">登出</button>
    </div>
  </div>

  <div id="noFamily" class="card hidden">
    <h2>建立或加入群組</h2>

    <div class="row">
      <div>
        <h3>建立新群組</h3>
        <label for="newFamilyName">群組名稱</label>
        <input id="newFamilyName" placeholder="例如：李家">
        <button id="createFamilyBtn" type="button" style="margin-top:12px">建立群組</button>
      </div>

      <div>
        <h3>加入既有群組</h3>
        <label for="joinCode">群組邀請碼</label>
        <input id="joinCode" placeholder="例如：ABCD-1234">
        <button id="joinFamilyBtn" type="button" style="margin-top:12px">加入群組</button>
      </div>
    </div>

    <div id="familyStatus" class="status"></div>
  </div>

  <div id="familyApp" class="layout hidden">
    <div>
      <section class="card">
        <h2>群組資訊</h2>
        <div id="familyInfo" class="familybox"></div>
      </section>

      <section class="card">
        <h2>新增食品</h2>

        <label for="name">食品名稱</label>
        <input id="name" placeholder="例如：鮮奶">

        <div class="row">
          <div>
            <label for="qty">數量</label>
            <input id="qty" type="number" min="1" value="1">
          </div>

          <div>
            <label for="location">位置</label>
            <select id="location">
              <option>冰箱</option>
              <option>冷凍</option>
              <option>常溫</option>
              <option>其他</option>
            </select>
          </div>
        </div>

        <label for="expiry">到期日</label>
        <input id="expiry" type="date">
        <button id="scanExpiryBtn" class="ghost" type="button" style="margin-top:8px">📷 掃描食品日期</button>
        <div class="scan-note">掃描只是輔助；辨識失敗時仍可直接手動輸入到期日。</div>

        <label for="note">備註</label>
        <textarea id="note" rows="2"></textarea>

        <label for="newNotifyMode">Email 提醒</label>
        <select id="newNotifyMode">
          <option value="inherit">使用群組預設</option>
          <option value="custom">自訂提前天數</option>
          <option value="off">這項食品不提醒</option>
        </select>
        <div id="newNotifyDaysWrap" class="hidden">
          <label for="newNotifyDays">提前幾天提醒</label>
          <input id="newNotifyDays" type="number" min="0" max="365" value="3">
        </div>

        <button id="addBtn" type="button" style="margin-top:12px">新增食品</button>
        <div id="foodStatus" class="status"></div>
      </section>
    </div>

    <section class="card">
      <div class="tabs">
        <button id="listTab" class="active" type="button">食品清單</button>
        <button id="calendarTab" class="inactive" type="button">到期日曆</button>
      </div>

      <div id="listView"></div>

      <div id="calendarView" class="hidden">
        <div class="calendar-head">
          <button id="prevMonth" class="ghost" type="button">←</button>
          <strong id="monthTitle"></strong>
          <button id="nextMonth" class="ghost" type="button">→</button>
        </div>
        <div class="cal" id="calendar"></div>
      </div>
    </section>
  </div>
</section>


<dialog id="ocrDialog">
  <div class="modal">
    <h2>掃描食品日期</h2>

    <div id="ocrOfflineBox" class="ocr-offline-box">
      <div class="ocr-offline-row">
        <div>
          <div class="ocr-offline-title">PP-OCRv6 Tiny 離線辨識包</div>
          <div id="ocrOfflineStatus" class="ocr-offline-status">正在檢查…</div>
        </div>
        <button id="ocrOfflineDownloadBtn" class="ghost" type="button">下載 OCR 離線包</button>
      </div>
      <div id="ocrOfflineProgress" class="ocr-offline-progress hidden">
        <div id="ocrOfflineProgressBar"></div>
      </div>
    </div>

    <label>選擇圖片來源</label>

    <div class="ocr-source-buttons ocr-mobile-only">
      <button id="ocrCameraBtn" class="ghost" type="button">📷 拍照</button>
      <button id="ocrGalleryBtn" class="ghost" type="button">🖼 相簿</button>
    </div>

    <div class="ocr-desktop-only">
      <div style="width:100%">
        <div id="ocrDropZone" class="ocr-dropzone">
          <strong>拖曳圖片到這裡</strong>
          <span>或使用下方按鈕選擇圖片</span>
        </div>
        <div class="ocr-source-buttons">
          <button id="ocrDesktopFileBtn" class="ghost" type="button">🖼 選擇圖片</button>
        </div>
      </div>
    </div>

    <input id="ocrCameraFile" class="ocr-file-input" type="file" accept="image/*" capture="environment">
    <input id="ocrGalleryFile" class="ocr-file-input" type="file" accept="image/*">

    <div id="ocrPreviewWrap" class="ocr-preview-wrap hidden">
      <canvas id="ocrCanvas"></canvas>
    </div>

    <div id="ocrHelp" class="ocr-help hidden">
      可直接辨識整張圖片，也可以在圖片上拖曳框選日期區域；框得越準，通常辨識越好。
    </div>

    <div class="ocr-toolbar">
      <button id="ocrResetCropBtn" class="ghost hidden" type="button">清除框選</button>
      <button id="ocrStartBtn" class="ghost" type="button" disabled>快速辨識</button>
      <button id="ocrAdvancedBtn" class="ghost hidden" type="button">加強日期辨識</button>
    </div>

    <div id="ocrStatus" class="status"></div>

    <div id="ocrProgressBox" class="ocr-progress hidden">
      <div id="ocrProgressBar"></div>
    </div>

    <div id="ocrResults" class="ocr-results hidden">
      <h3>辨識到的日期</h3>
      <div id="ocrCandidateList"></div>
      <div id="ocrRawText" class="ocr-text"></div>
    <details id="ocrDebugDetails" style="margin-top:10px">
      <summary style="cursor:pointer;font-weight:700">查看辨識影像預覽</summary>
      <div id="ocrDebugGrid" class="ocr-debug-grid"></div>
    </details>

    </div>

    <div class="modal-actions">
      <button id="ocrCloseBtn" class="secondary" type="button">關閉</button>
      <button id="ocrApplyBtn" type="button" disabled>套用選取日期</button>
    </div>
  </div>
</dialog>

<dialog id="editDialog">
  <div class="modal">
    <h2>編輯食品</h2>
    <input id="editId" type="hidden">

    <label for="editName">食品名稱</label>
    <input id="editName">

    <div class="row">
      <div>
        <label for="editQty">數量</label>
        <input id="editQty" type="number" min="1">
      </div>
      <div>
        <label for="editLocation">位置</label>
        <select id="editLocation">
          <option>冰箱</option>
          <option>冷凍</option>
          <option>常溫</option>
          <option>其他</option>
        </select>
      </div>
    </div>

    <label for="editExpiry">到期日</label>
    <input id="editExpiry" type="date">

    <label for="editNote">備註</label>
    <textarea id="editNote" rows="3"></textarea>

    <label for="editNotifyMode">Email 提醒</label>
    <select id="editNotifyMode">
      <option value="inherit">使用群組預設</option>
      <option value="custom">自訂提前天數</option>
      <option value="off">這項食品不提醒</option>
    </select>
    <div id="editNotifyDaysWrap" class="hidden">
      <label for="editNotifyDays">提前幾天提醒</label>
      <input id="editNotifyDays" type="number" min="0" max="365" value="3">
    </div>

    <div class="modal-actions">
      <button id="editCancelBtn" class="secondary" type="button">取消</button>
      <button id="editSaveBtn" type="button">儲存修改</button>
    </div>
  </div>
</dialog>



<dialog id="notificationDialog">
  <div class="modal">
    <h2>提醒設定</h2>
    <div id="notificationBody">
      <div class="family-loading">
        <div class="spinner"></div>
        <h3 style="margin-bottom:6px">正在載入提醒設定…</h3>
      </div>
    </div>
    <div id="notificationStatus" class="status"></div>
    <div class="modal-actions">
      <button id="notificationCloseBtn" class="secondary" type="button">關閉</button>
      <button id="notificationSaveBtn" type="button">儲存提醒設定</button>
    </div>
  </div>
</dialog>

<dialog id="groupDialog">
  <div class="modal">
    <h2>新增 / 加入群組</h2>

    <div class="row">
      <div>
        <h3>建立新群組</h3>
        <label for="modalNewGroupName">群組名稱</label>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbybz7oq_oee7FmCZclj3AgzMjRzsN2HsAnnUT5EMR_6Sy3hQMIFDtsBeK8uhDX2s22Lag/exec';
const TOKEN_KEY = 'food-family-session-v3';
const LAST_EMAIL_KEY = 'food-family-last-email-v1';
const SYNC_DELAY_MS = 30000;

let token = localStorage.getItem(TOKEN_KEY) || '';
let me = null;
let foods = [];
let currentFamilyId = '';
let currentMonth = new Date();
currentMonth.setDate(1);

let pendingChanges = [];
let syncTimer = null;
let syncing = false;
let currentFamilyDetails = null;
let familyManageLoading = false;
let notificationLoading = false;
let notificationSettings = null;
let loadFailed = false;

const $ = id => document.getElementById(id);

async function api(action, data = {}, timeoutMs = 25000) {
  const body = new URLSearchParams({ action, ...data });
  if (token) body.set('sessionToken', token);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const r = await fetch(API_URL, {
      method:'POST',
      body,
      signal:controller.signal
    });

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const obj = await r.json();

    if (!obj.ok) {
      const e = new Error(obj.error || '操作失敗');
      e.apiError = true;
      throw e;
    }

    return obj;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時，請稍後再試。');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function show(id,on=true){ $(id).classList.toggle('hidden',!on); }

function escapeHtml(s='') {
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function setStatus(id,msg,kind='') {
  const e=$(id); e.textContent=msg; e.className='status '+kind;
}

function setBusy(button,busy,busyText,normalText) {
  button.disabled=busy; button.textContent=busy?busyText:normalText;
}

function uid() {
  return 'tmp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

function requestUid() {
  if (crypto && crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return 'req-' + Date.now().toString(36) + '-' +
    Math.random().toString(36).slice(2,10);
}

async function safeGroupRequest(action,payload,statusId) {
  const requestId=requestUid();
  const data={...payload,requestId};

  try {
    return await api(action,data,30000);
  } catch(e) {
    // 後端有明確回覆的業務錯誤，不重試。
    if(e.apiError) throw e;

    setStatus(
      statusId,
      '伺服器回應較慢，正在確認操作結果，請不要重複按按鈕…'
    );

    // 第一次可能已成功但只是回傳逾時。
    // 用完全相同 requestId 安全重試一次。
    try {
      return await api(action,data,45000);
    } catch(e2) {
      if(e2.apiError) throw e2;

      // 仍沒有回應時，改查 RequestLog。
      for(let i=0;i<5;i++) {
        await new Promise(resolve=>setTimeout(resolve,1500));

        try {
          const check=await api('checkRequest',{
            requestId,
            requestAction:action
          },20000);

          if(
            check.found &&
            check.status==='done' &&
            check.result
          ) {
            return {
              ok:true,
              ...check.result,
              replayed:true
            };
          }
        } catch {}
      }

      throw new Error(
        '目前無法確認伺服器結果。請稍後重新整理頁面；系統已使用防重複 requestId，不需要立刻再次建立。'
      );
    }
  }
}


function setSyncState(state,text) {
  $('syncDot').className='syncdot '+state;
  $('syncText').textContent=text;

  if (state !== 'dirty') {
    $('syncText').title = '';
  }

  if (loadFailed) {
    $('syncNowBtn').textContent='重新載入';
    $('syncNowBtn').disabled=false;
  } else {
    $('syncNowBtn').textContent='立即同步';
    $('syncNowBtn').disabled = syncing || pendingChanges.length===0;
  }
}

function scheduleSync() {
  if (syncTimer) clearTimeout(syncTimer);

  setSyncState(
    'dirty',
    `待同步 ${pendingChanges.length}`
  );

  $('syncText').title = '最後一次修改後 30 秒會自動同步';
  syncTimer=setTimeout(()=>syncPending(),SYNC_DELAY_MS);
}

function queueChange(change) {
  // 同一筆資料的 update 盡量合併，避免連按 -1 造成一堆 change。
  if (change.type === 'update') {
    const existing = pendingChanges.find(x =>
      x.type === 'update' && x.id === change.id
    );
    if (existing) {
      existing.food = change.food;
      existing.expectedUpdatedAt = change.expectedUpdatedAt;
      scheduleSync();
      return;
    }
  }

  if (change.type === 'delete') {
    pendingChanges = pendingChanges.filter(x =>
      !(x.type === 'update' && x.id === change.id)
    );
  }

  pendingChanges.push(change);
  scheduleSync();
}

async function syncPending() {
  if (syncing || !pendingChanges.length || !currentFamilyId) return;

  syncing=true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=null;

  setSyncState('syncing','同步中…');

  const batch = pendingChanges.slice();

  try {
    const r = await api('syncChanges', {
      familyId: currentFamilyId,
      changes: JSON.stringify(batch)
    }, 30000);

    const appliedKeys = new Set((r.applied || []).map(x=>x.clientKey));
    pendingChanges = pendingChanges.filter(ch => !appliedKeys.has(ch.clientKey));

    // 後端回傳正式資料，直接套回本地，包含 tmp id -> 正式 id。
    for (const item of (r.items || [])) {
      if (item.tempId) {
        const f = foods.find(x=>x.id===item.tempId);
        if (f) {
          Object.assign(f,item.food);

          // 新增資料同步成功後，清除前端待同步標記。
          delete f._pending;
        }
      } else if (item.food) {
        const i=foods.findIndex(x=>x.id===item.food.id);
        if(i>=0) foods[i]=item.food;
      }
    }

    if ((r.deletedIds||[]).length) {
      foods = foods.filter(f=>!r.deletedIds.includes(f.id));
    }

    render();

    if ((r.conflicts || []).length) {
      setSyncState('dirty',`有 ${r.conflicts.length} 筆衝突，已保留未同步狀態`);
      alert('有資料在其他裝置被修改，部分變更未寫入。請重新同步資料後再確認。');
    } else if (pendingChanges.length) {
      scheduleSync();
    } else {
      setSyncState('synced','已同步');
    }
  } catch(e) {
    if(/沒有編輯權限|只有 Owner|Viewer/.test(e.message)) {
      // 權限可能已被另一台裝置改成 Viewer。
      // 本地未同步變更不能繼續保留，否則會無限重試。
      pendingChanges=[];
      if(syncTimer) clearTimeout(syncTimer);
      syncTimer=null;

      setSyncState('syncing','權限已變更，正在重新載入…');

      alert(
        '你的群組權限已變更，目前的未同步修改不會寫入。\n' +
        '系統將重新載入最新資料。'
      );

      await loadFamily();
    } else {
      setSyncState('dirty',`同步失敗：${e.message}`);
      scheduleSync();
    }
  } finally {
    syncing=false;
    $('syncNowBtn').disabled = pendingChanges.length===0;
  }
}

$('syncNowBtn').onclick = async () => {
  if (loadFailed) {
    await loadFamily();
  } else {
    await syncPending();
  }
};

window.addEventListener('beforeunload', e => {
  // 瀏覽器基於安全限制，不允許自訂「是否要同步？」的離開提示文字。
  // 只要還有未同步變更，就觸發瀏覽器原生的離開確認。
  if (pendingChanges.length) {
    e.preventDefault();
    e.returnValue='';
  }
});

function showLoginMode(mode) {
  show('loginForm',mode==='login');
  show('registerForm',mode==='register');

  $('registerTab').className=mode==='register'?'active':'inactive';
  setStatus('authStatus','');
}

$('loginTab').onclick=()=>showLoginMode('login');
$('registerTab').onclick=()=>showLoginMode('register');
$('forgotBtn').onclick=()=>{

  show('forgotStep1',true); show('forgotStep2',false); showLoginMode('forgot');

$('backToLoginBtn').onclick=()=>showLoginMode('login');

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('loginBtn');
  let slowTimer=null;

  try {
    setBusy(btn,true,'登入中…','登入');
    setStatus('authStatus','正在驗證帳號…');

    slowTimer=setTimeout(()=>{
      setStatus(
        'authStatus',
        '第一次登入可能正在升級舊密碼格式，請稍候，不需要重複按登入。',
        ''
      );
    },8000);

    localStorage.setItem(TOKEN_KEY,token);

function enterMain() {
  show('splash',false); show('authCard',false); show('mainApp',true);
  $('hello').textContent=`你好，${me.displayName}（${me.email}）`;
  renderFamilies(me.families||[]);
}

async function restoreSession() {
  if(!token) { show('splash',false); show('authCard',true); return; }
  show('authCard',false); show('mainApp',false); show('splash',true);

  try {
    const r=await api('me',{},20000);
    me=r.user; me.families=r.families||[];
    enterMain();
  } catch(e) {
    const invalid=/尚未登入|登入已過期|使用者不存在/.test(e.message);
    if(invalid) {
      token=''; localStorage.removeItem(TOKEN_KEY);
      show('splash',false); show('authCard',true);
      setStatus('authStatus','登入狀態已過期，請重新登入。','err');
      return;
    }
    $('splashText').textContent='暫時無法連線，請重新整理頁面再試。';
  }
}

$('logoutBtn').onclick=async()=>{
  if(!confirm('確定要登出嗎？')) return;

  if(pendingChanges.length) {
    const syncFirst=confirm(
      '目前還有未同步的資料。\n\n' +
      '按「確定」：先同步再登出\n' +
      '按「取消」：留在目前頁面'
    );

    if(!syncFirst) return;

    await syncPending();

    if(pendingChanges.length) {
      alert('資料尚未同步完成，暫時不登出。');
      return;
    }
  }

  // 先保留舊 token，讓後端可以在背景將 Session 作廢。
  const oldToken=token;

  // 本機立即登出，不等待 Apps Script / Sheet。
  token='';
  localStorage.removeItem(TOKEN_KEY);
  me=null;
  foods=[];
  pendingChanges=[];

  show('mainApp',false);
  show('splash',false);
  show('authCard',true);
  showLoginMode('login');

  $('loginPassword').value='';
  setStatus('authStatus','已登出。','ok');

  // 背景 best-effort 通知後端刪除舊 Session。
  // 即使 Apps Script 此時較慢，也不影響使用者畫面。
  if(oldToken) {
    const body=new URLSearchParams({
      action:'logout',
      sessionToken:oldToken
    });

    fetch(API_URL,{
      method:'POST',
      body,
      keepalive:true
    }).catch(()=>{});
  }
};

function renderFamilies(families) {
  me.families=families;
  const sel=$('familySelect');
  sel.innerHTML='';

  if(!families.length) {
    show('noFamily'); show('familyApp',false);
    sel.classList.add('hidden'); $('familyManageBtn').classList.add('hidden'); $('groupAddBtn').classList.remove('hidden');
    setSyncState('synced','沒有群組資料');
    return;
  }

  show('noFamily',false); show('familyApp');
  sel.classList.remove('hidden'); $('familyManageBtn').classList.remove('hidden'); $('groupAddBtn').classList.remove('hidden');

  for(const f of families) {
    const o=document.createElement('option');
    o.value=f.familyId; o.textContent=f.familyName; sel.appendChild(o);
  }

  currentFamilyId=(families.find(x=>x.familyId===currentFamilyId)||families[0]).familyId;
  sel.value=currentFamilyId;
  loadFamily();
}

$('familySelect').onchange=async()=>{
  if(pendingChanges.length) {
    await syncPending();
    if(pendingChanges.length) {
      alert('目前還有未同步資料，請先完成同步。');
      $('familySelect').value=currentFamilyId;
      return;
    }
  }
  currentFamilyId=$('familySelect').value;
  loadFamily();
};

$('createFamilyBtn').onclick=async()=>{
  const btn=$('createFamilyBtn');
  try {
    const familyName=$('newFamilyName').value.trim();
    if(!familyName) throw new Error('請輸入群組名稱。');

    setBusy(btn,true,'建立中…','建立群組');
    setStatus('familyStatus','正在建立群組，請不要重複送出…');

    const r=await safeGroupRequest(
      'createFamily',
      {familyName},
      'familyStatus'
    );

    if(!me.families.some(x=>x.familyId===r.family.familyId)) {
      me.families=[...(me.families||[]),r.family];
    }

    currentFamilyId=r.family.familyId;
    renderFamilies(me.families);
    setStatus('familyStatus','群組建立完成。','ok');
  } catch(e) {
    setStatus('familyStatus',e.message,'err');
  } finally {
    setBusy(btn,false,'建立中…','建立群組');
  }
};

$('joinFamilyBtn').onclick=async()=>{
  const btn=$('joinFamilyBtn');
  try {
    const inviteCode=$('joinCode').value.trim();
    if(!inviteCode) throw new Error('請輸入群組邀請碼。');

    setBusy(btn,true,'加入中…','加入群組');
    setStatus('familyStatus','正在加入群組，請不要重複送出…');

    const r=await safeGroupRequest(
      'joinFamily',
      {inviteCode},
      'familyStatus'
    );

    if(!me.families.some(x=>x.familyId===r.family.familyId)) {
      me.families=[...(me.families||[]),r.family];
    }

    currentFamilyId=r.family.familyId;
    renderFamilies(me.families);
    setStatus('familyStatus','已加入群組。','ok');
  } catch(e) {
    setStatus('familyStatus',e.message,'err');
  } finally {
    setBusy(btn,false,'加入中…','加入群組');
  }
};


function currentGroup() {
  return (me?.families || []).find(x => x.familyId === currentFamilyId) || null;
}

function canEditCurrentGroup() {
  const role=currentGroup()?.role || '';
  return role==='owner' || role==='member';
}

function applyRoleUi() {
  const editable=canEditCurrentGroup();
  const fam=currentGroup();

  // 新增食品整區保留可見，但 Viewer 明確顯示唯讀並鎖住輸入。
  const ids=['name','qty','location','expiry','note','scanExpiryBtn','newNotifyMode','newNotifyDays','addBtn'];

  for(const id of ids) {
    const el=$(id);
    if(el) el.disabled=!editable;
  }

  const card=$('addBtn')?.closest('.card');
  if(card) {
    let notice=card.querySelector('.viewer-readonly-notice');

    if(!editable) {
      if(!notice) {
        notice=document.createElement('div');
        notice.className='viewer-readonly-notice status';
        notice.style.marginBottom='10px';
        notice.style.color='#667085';
        card.insertBefore(notice,card.querySelector('label'));
      }

      notice.textContent='目前角色為 Viewer，只能查看群組資料，不能新增或修改食品。';
    } else if(notice) {
      notice.remove();
    }
  }

  if(fam) {
    const info=$('familyInfo');
    if(info) {
      const roleLine=info.querySelector('.role-line');
      if(roleLine) roleLine.textContent='角色：'+fam.role;
    }
  }
}

async function loadFamily(retryCount = 0) {
  // 切換群組時才應該沒有未同步變更；
  // 一般重新載入失敗不再把 UI 鎖死。
  loadFailed=false;
  setSyncState('synced', retryCount ? '重新載入中…' : '載入中…');

  const fam=me.families.find(x=>x.familyId===currentFamilyId);
  if(!fam) return;

  $('familyInfo').innerHTML=`
    <div><b>${escapeHtml(fam.familyName)}</b></div>
    <div class="small role-line">角色：${escapeHtml(fam.role)}</div>
    ${fam.role==='owner'
      ? `<div style="margin-top:10px">邀請碼</div>
         <div class="code">${escapeHtml(fam.inviteCode)}</div>`
      : ''
    }
  `;

  try {
    const r=await api('listFoods',{familyId:currentFamilyId},35000);

    const famNow=currentGroup();
    if(famNow && r.myRole) {
      famNow.role=r.myRole;
    }

    foods=r.foods||[];
    applyRoleUi();
    render();

    loadFailed=false;
    setStatus('foodStatus','');
    setSyncState('synced','已同步');
  } catch(e) {
    // Apps Script 偶爾冷啟動，第一次失敗時自動再試一次。
    if (retryCount < 1) {
      setSyncState('syncing','連線較慢，正在重試…');
      await new Promise(resolve=>setTimeout(resolve,1200));
      return loadFamily(retryCount+1);
    }

    loadFailed=true;
    setStatus('foodStatus','食品資料載入失敗：'+e.message,'err');
    setSyncState('dirty','載入失敗：'+e.message);
  }
}

$('addBtn').onclick=()=>{
  try {
    if(!canEditCurrentGroup()) {
      throw new Error('Viewer 只能查看資料，不能新增食品。');
    }

    const name=$('name').value.trim();
    const expiry=$('expiry').value;
    if(!name||!expiry) throw new Error('請填食品名稱與到期日');

    const tempId=uid();
    const food={
      id:tempId,
      name,
      qty:Math.max(1,Number($('qty').value||1)),
      location:$('location').value,
      expiry,
      note:$('note').value.trim(),
      notifyMode:$('newNotifyMode').value || 'inherit',
      notifyDaysBefore:$('newNotifyMode').value==='custom' ? Math.max(0,Number($('newNotifyDays').value||0)) : '',
      updatedAt:'',
      _pending:true
    };

    foods.push(food);

    queueChange({
      clientKey:uid(),
      type:'add',
      tempId,
      food:clientFoodPayload(food)
    });

    $('name').value=''; $('qty').value='1'; $('note').value=''; $('newNotifyMode').value='inherit'; show('newNotifyDaysWrap',false);
    render();
    setStatus('foodStatus','已加入本機，稍後自動同步。','ok');
  } catch(e) {
    setStatus('foodStatus',e.message,'err');
  }
};

window.consume=id=>{
  if(!canEditCurrentGroup()) {
    alert('Viewer 只能查看資料，不能修改食品。');
    return;
  }

  const f=foods.find(x=>x.id===id);
  if(!f) return;

  f.qty=Number(f.qty)-1;

  if(f.qty<=0) {
    foods=foods.filter(x=>x.id!==id);

    if(id.startsWith('tmp-')) {
      pendingChanges=pendingChanges.filter(x=>x.tempId!==id);
      if(pendingChanges.length) scheduleSync();
      else setSyncState('synced','已同步');
    } else {
      queueChange({
        clientKey:uid(),type:'delete',id,
        expectedUpdatedAt:f.updatedAt||''
      });
    }
  } else if(id.startsWith('tmp-')) {
    const add=pendingChanges.find(x=>x.type==='add'&&x.tempId===id);
    if(add) add.food.qty=f.qty;
    scheduleSync();
  } else {
    queueChange({
      clientKey:uid(),
      type:'update',
      id,
      expectedUpdatedAt:f.updatedAt||'',
      food:clientFoodPayload(f)
    });
  }

  render();
};

window.removeFood=id=>{
  if(!canEditCurrentGroup()) {
    alert('Viewer 只能查看資料，不能刪除食品。');
    return;
  }

  if(!confirm('確定刪除？')) return;

  const f=foods.find(x=>x.id===id);
  foods=foods.filter(x=>x.id!==id);

  if(id.startsWith('tmp-')) {
    pendingChanges=pendingChanges.filter(x=>x.tempId!==id);
    if(pendingChanges.length) scheduleSync();
    else setSyncState('synced','已同步');
  } else {
    queueChange({
      clientKey:uid(),
      type:'delete',
      id,
      expectedUpdatedAt:f?.updatedAt||''
    });
  }

  render();
};

window.openEdit=id=>{

function clientFoodPayload(f) {
  return {
    name:f.name,
    qty:Number(f.qty),
    location:f.location,
    expiry:f.expiry,
    note:f.note||'',
    notifyMode:f.notifyMode||'inherit',
    notifyDaysBefore:(f.notifyMode||'inherit')==='custom' ? Math.max(0,Number(f.notifyDaysBefore||0)) : ''
  };
}

function foodReminderLabel(f) {
  const mode=f.notifyMode||'inherit';
  if(mode==='off') return '不提醒';
  if(mode==='custom') return `提前 ${Number(f.notifyDaysBefore||0)} 天`;
  return '使用群組預設';
}

function daysLeft(s) {
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(s+'T00:00:00')-t)/86400000);
}

function badgeInfo(d) {
  if(d<0) return ['danger',`已過期 ${-d} 天`];
  if(d===0) return ['danger','今天到期'];
  if(d<=3) return ['warn',`剩 ${d} 天`];
  return ['ok',`剩 ${d} 天`];
}

function renderList() {
  const box=$('listView');
  const sorted=[...foods].sort((a,b)=>a.expiry.localeCompare(b.expiry));

  if(!sorted.length) {
    box.innerHTML='<div class="empty">目前沒有食品資料</div>';
    return;
  }

  box.innerHTML=sorted.map(f=>{
    const [c,t]=badgeInfo(daysLeft(f.expiry));
    return `
      <div class="food ${f._pending?'pending':''}">
        <div>
          <div class="food-title">${escapeHtml(f.name)} ×${f.qty}</div>
          <div class="meta">
            到期：${escapeHtml(f.expiry)}<br>
            位置：${escapeHtml(f.location)}
            ${f.note?`<br>備註：${escapeHtml(f.note)}`:''}
            <br>提醒：${escapeHtml(foodReminderLabel(f))}
          </div>
          <span class="badge ${c}">${t}</span>
          ${f._pending?'<span class="badge warn">待同步</span>':''}
        </div>
        <div class="actions">
          ${canEditCurrentGroup()
            ? `<button class="ghost" onclick="openEdit('${f.id}')">編輯</button>
               <button class="ghost" onclick="consume('${f.id}')">-1</button>
               <button class="danger" onclick="removeFood('${f.id}')">刪除</button>`
            : `<span class="small">唯讀</span>`
          }
        </div>
      </div>
    `;
  }).join('');
}

function renderCalendar() {
  const y=currentMonth.getFullYear(),m=currentMonth.getMonth();
  $('monthTitle').textContent=`${y} 年 ${m+1} 月`;

  let h=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());

  for(let i=0;i<42;i++) {
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const ev=foods.filter(f=>f.expiry===ds);

    h+=`
      <div class="day ${d.getMonth()!==m?'muted':''}">
        <div class="num">${d.getDate()}</div>
        ${ev.map(f=>`<div class="event">${escapeHtml(f.name)} ×${f.qty}</div>`).join('')}
      </div>
    `;
  }

  $('calendar').innerHTML=h;
}

// 只套用「新增 / 加入群組」與「群組設定」兩個 Pop-up。
function enableBackdropClose(dialog) {
  dialog.addEventListener('click', e => {
    // 只有事件本身真的落在 dialog 背景上才判斷是否關閉。
    // 避免程式呼叫隱藏 file input.click() 時，
    // 因為座標為 0,0 被誤判成點擊視窗外部。
    if (e.target !== dialog) return;

    const rect=dialog.getBoundingClientRect();
    const inside=
      e.clientX >= rect.left &&
      e.clientX <= rect.right &&
      e.clientY >= rect.top &&
      e.clientY <= rect.bottom;

    if(!inside) dialog.close();
  });
}

    img.src = url;
  });

function canvasPoint(evt) {
  const canvas = $('ocrCanvas');
  const rect = canvas.getBoundingClientRect();
  const src = evt.touches ? evt.touches[0] : evt;

  return {
    x: (src.clientX - rect.left) * canvas.width / rect.width,
    y: (src.clientY - rect.top) * canvas.height / rect.height
  };
}

function drawOcrCanvas(tempCrop = null) {
  if (!ocrImage) return;

  const canvas = $('ocrCanvas');
  const ctx = canvas.getContext('2d');

  const maxW = 1000;
  const scale = Math.min(1, maxW / ocrImage.naturalWidth);

  canvas.width = Math.round(ocrImage.naturalWidth * scale);
  canvas.height = Math.round(ocrImage.naturalHeight * scale);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(ocrImage,0,0,canvas.width,canvas.height);

  const c = tempCrop || ocrCrop;

  if (c) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.38)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.clearRect(c.x,c.y,c.w,c.h);
    ctx.drawImage(
      ocrImage,
      c.x / scale,
      c.y / scale,
      c.w / scale,
      c.h / scale,
      c.x,c.y,c.w,c.h
    );

    ctx.strokeStyle = '#00c2ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(c.x,c.y,c.w,c.h);
    ctx.restore();
  }
}

const ocrCanvas = $('ocrCanvas');

ocrCanvas.addEventListener('pointerdown', e => {
  if (!ocrImage) return;
  ocrDragging = true;
  ocrDragStart = canvasPoint(e);
  ocrCanvas.setPointerCapture?.(e.pointerId);
});

ocrCanvas.addEventListener('pointermove', e => {
  if (!ocrDragging || !ocrDragStart) return;
  const p = canvasPoint(e);

  const crop = {
    x: Math.min(ocrDragStart.x,p.x),
    y: Math.min(ocrDragStart.y,p.y),
    w: Math.abs(p.x-ocrDragStart.x),
    h: Math.abs(p.y-ocrDragStart.y)
  };

  if (crop.w > 5 && crop.h > 5) drawOcrCanvas(crop);
});

ocrCanvas.addEventListener('pointerup', e => {
  if (!ocrDragging || !ocrDragStart) return;

  const p = canvasPoint(e);
  ocrDragging = false;

  const crop = {
    x: Math.min(ocrDragStart.x,p.x),
    y: Math.min(ocrDragStart.y,p.y),
    w: Math.abs(p.x-ocrDragStart.x),
    h: Math.abs(p.y-ocrDragStart.y)
  };

  ocrDragStart = null;

  if (crop.w >= 20 && crop.h >= 20) {
    ocrCrop = crop;
    show('ocrResetCropBtn', true);
  } else {
    ocrCrop = null;
    show('ocrResetCropBtn', false);
  }

  drawOcrCanvas();
});

$('ocrResetCropBtn').onclick = () => {
  ocrCrop = null;
  show('ocrResetCropBtn', false);
  drawOcrCanvas();
};

function makeOcrSourceCanvas() {
  const display = $('ocrCanvas');

  if (!ocrCrop) {
    const out = document.createElement('canvas');
    out.width = display.width;
    out.height = display.height;
    out.getContext('2d').drawImage(display,0,0);
    return out;
  }

  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(ocrCrop.w));
  out.height = Math.max(1, Math.round(ocrCrop.h));

  out.getContext('2d').drawImage(
    display,
    ocrCrop.x,ocrCrop.y,ocrCrop.w,ocrCrop.h,
    0,0,out.width,out.height
  );

  return out;
}

function upscaleCanvas(source, factor = 3) {
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(source.width * factor));
  out.height = Math.max(1, Math.round(source.height * factor));

  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, 0, 0, out.width, out.height);

  return out;
}

function preprocessCanvas(source, mode) {
  const out = document.createElement('canvas');
  out.width = source.width;
  out.height = source.height;

  const ctx = out.getContext('2d');
  ctx.drawImage(source,0,0);

  if (mode === 'original') return out;

  const img = ctx.getImageData(0,0,out.width,out.height);
  const d = img.data;

  // 先算灰階平均，讓 threshold 能跟著照片亮度調整。
  let graySum = 0;
  const grays = new Uint8Array(d.length / 4);

  for (let i=0, p=0;i<d.length;i+=4,p++) {
    const gray = Math.round(
      d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114
    );
    grays[p] = gray;
    graySum += gray;
  }

  const avg = graySum / grays.length;

  for (let i=0, p=0;i<d.length;i+=4,p++) {
    const gray = grays[p];
    let v = gray;

    if (mode === 'gray') {
      // 拉大中間調對比
      v = Math.max(0, Math.min(255, (gray - 128) * 1.55 + 128));
    } else if (mode === 'contrast') {
      // 自適應門檻：小黑字 / 點陣字在淺背景上通常較有效
      const threshold = Math.max(105, Math.min(185, avg * 0.82));
      v = gray > threshold ? 255 : 0;
    } else if (mode === 'softThreshold') {
      const threshold = Math.max(115, Math.min(195, avg * 0.9));
      if (gray < threshold - 15) v = 0;
      else if (gray > threshold + 15) v = 255;
      else v = Math.max(0, Math.min(255, (gray - threshold) * 6 + 128));
    } else if (mode === 'invert') {
      v = 255 - gray;
    }

    d[i]=d[i+1]=d[i+2]=v;
  }

  ctx.putImageData(img,0,0);
  return out;
}


let cvReadyPromise = null;

function waitForOpenCv(timeoutMs = 12000) {
  if (window.cv && cv.Mat) {
    return Promise.resolve(true);
  }

  if (cvReadyPromise) return cvReadyPromise;

  cvReadyPromise = new Promise(resolve => {
    const started = Date.now();

    const timer = setInterval(() => {
      try {
        if (window.cv && cv.Mat) {
          clearInterval(timer);
          resolve(true);
          return;
        }
      } catch {}

      if (Date.now() - started >= timeoutMs) {
        clearInterval(timer);
        resolve(false);
      }
    }, 150);
  });

  return cvReadyPromise;
}

async function ensureOcrServiceWorker() {
  if (!('serviceWorker' in navigator)) {
    return false;
  }

  if (!/^https?:$/.test(location.protocol)) {
    return false;
  }

  if (!ocrServiceWorkerPromise) {
    ocrServiceWorkerPromise = (async () => {
      const reg = await navigator.serviceWorker.register(
        './service-worker.js',
        {scope:'./'}
      );

      await navigator.serviceWorker.ready;

      if (!navigator.serviceWorker.controller) {
        await new Promise(resolve => {
          let done = false;

          const finish = () => {
            if (done) return;
            done = true;
            resolve();
          };

          navigator.serviceWorker.addEventListener(
            'controllerchange',
            finish,
            {once:true}
          );

          setTimeout(finish,3500);
        });
      }

      return !!navigator.serviceWorker.controller;
    })();
  }

  try {
    return await ocrServiceWorkerPromise;
  } catch (e) {
    console.warn('Service Worker registration failed:',e);
    ocrServiceWorkerPromise = null;
    return false;
  }
}

async function sha256Hex(buffer) {
  const digest = await crypto.subtle.digest(
    'SHA-256',
    buffer
  );

  return [...new Uint8Array(digest)]
    .map(b => b.toString(16).padStart(2,'0'))
    .join('');
}

async function getOcrOfflineState() {
  if (!('caches' in window)) {
    return {
      supported:false,
      ready:false,
      modelCount:0,
      total:OCR_OFFLINE_PACK.assets.length
    };
  }

  const cache = await caches.open(
    OCR_OFFLINE_PACK.modelCache
  );

  let modelCount = 0;

  for (const asset of OCR_OFFLINE_PACK.assets) {
    if (await cache.match(asset.url)) {
      modelCount++;
    }
  }

  const marker = await cache.match(
    OCR_OFFLINE_PACK.readyKey
  );

  return {
    supported:true,
    ready:
      modelCount === OCR_OFFLINE_PACK.assets.length &&
      !!marker,
    modelCount,
    total:OCR_OFFLINE_PACK.assets.length
  };
}

async function refreshOcrOfflineStatus() {
  const status = $('ocrOfflineStatus');

  if (!status || !btn) return;

      btn.textContent='完成 OCR 離線包';

      status.className='ocr-offline-status warn';
      status.textContent =
        '⚠ 尚未下載。模型本體約 6.3 MB，另含首次需要的 OCR 執行元件；建議連 Wi‑Fi 後下載。';
      btn.textContent='下載 OCR 離線包';
    }
  } catch (e) {
    status.className='ocr-offline-status err';
    status.textContent='檢查 OCR 離線包失敗：' + e.message;
    btn.disabled=false;
  }
}

async function cacheOneOcrModel(cache,asset) {
  const existing = await cache.match(asset.url);

  if (existing) {
    // 已經在 Cache Storage 裡就不重新消耗網路流量。
    return;
  }

  const response = await fetch(
    asset.url,
    {cache:'no-store'}
  );

  if (!response.ok) {
    throw new Error(
      `${asset.label}下載失敗（HTTP ${response.status}）。請確認 GitHub 上已上傳模型檔。`
    );
  }

  // 下載當下做一次 SHA-256 驗證，避免模型檔損壞或傳錯版本。
  const bytes = await response.clone().arrayBuffer();
  const hash = await sha256Hex(bytes);

  if (hash.toLowerCase() !== asset.sha256) {
    throw new Error(
      `${asset.label} SHA-256 不符，請重新執行模型下載腳本後再上傳。`
    );
  }

  await cache.put(
    asset.url,
    response
  );
}

async function initializePaddleOcrInternal({
  allowNetworkInit=false
}={}) {
  if (paddleOcrInstance) return paddleOcrInstance;
  if (paddleOcrInitPromise) return paddleOcrInitPromise;

  if (!/^https?:$/.test(location.protocol)) {
    throw new Error(
      'PP-OCRv6 需要從 HTTP/HTTPS 網頁執行；目前是 ' +
      location.protocol
    );
  }

  if (!allowNetworkInit) {
    const state = await getOcrOfflineState();

    if (!state.ready) {
      const err = new Error(
        'PP-OCRv6 離線包尚未下載。為避免使用行動網路，系統不會自動下載模型。'
      );
      err.code='OCR_OFFLINE_PACK_NOT_READY';
      throw err;
    }
  }

  paddleOcrInitPromise = (async () => {
    const mod = await import(
      'https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm'
    );

    paddleOcrInstance = await mod.PaddleOCR.create({
      textDetectionModelName:'PP-OCRv6_tiny_det',
      textDetectionModelAsset:{
        url:OCR_OFFLINE_PACK.assets[0].url
      },
      textRecognitionModelName:'PP-OCRv6_tiny_rec',
      textRecognitionModelAsset:{
        url:OCR_OFFLINE_PACK.assets[1].url
      },
      worker:false,
      ortOptions:{
        backend:'wasm',
        wasmPaths:
          'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
        numThreads:1,
        simd:true
      }
    });

    return paddleOcrInstance;
  })();

  try {
    return await paddleOcrInitPromise;
  } catch (e) {
    paddleOcrInitPromise=null;
    paddleOcrInstance=null;
    throw e;
  }
}

async function getPaddleOcr() {
  const controlled = await ensureOcrServiceWorker();

  if (!controlled) {
    throw new Error(
      'Service Worker 尚未就緒，為避免重新使用網路下載 OCR 資源，這次先不啟動 PP-OCRv6。'
    );
  }

  return initializePaddleOcrInternal({
    allowNetworkInit:false
  });
}

async function downloadOcrOfflinePack() {
  const btn = $('ocrOfflineDownloadBtn');
  const status = $('ocrOfflineStatus');
  const progress = $('ocrOfflineProgress');
  const bar = $('ocrOfflineProgressBar');

  if (!btn || !status || !progress || !bar) return;

  const oldText = btn.textContent;

  try {
    btn.disabled=true;
    progress.classList.remove('hidden');
    bar.style.width='3%';

    status.className='ocr-offline-status';
    status.textContent='正在啟用離線快取…';

    const controlled = await ensureOcrServiceWorker();

    if (!controlled) {
      throw new Error(
        'Service Worker 尚未取得控制權。請重新整理頁面後再按一次下載。'
      );
    }

    const cache = await caches.open(
      OCR_OFFLINE_PACK.modelCache
    );

    // 開始前先移除 ready marker。
    await cache.delete(
      OCR_OFFLINE_PACK.readyKey
    );

    for (let i=0;i<OCR_OFFLINE_PACK.assets.length;i++) {
      const asset=OCR_OFFLINE_PACK.assets[i];

      status.textContent =
        `正在準備 ${asset.label}（${i+1}/${OCR_OFFLINE_PACK.assets.length}）…`;

      await cacheOneOcrModel(
        cache,
        asset
      );

      bar.style.width =
        `${15 + ((i+1)/OCR_OFFLINE_PACK.assets.length)*55}%`;
    }

    status.textContent =
      '模型已快取，正在初始化 PP-OCRv6 與執行元件…';
    bar.style.width='78%';

    // 只有使用者明確按下下載時，才允許 SDK / WASM 初次下載。
    paddleOcrInstance=null;
    paddleOcrInitPromise=null;

    await initializePaddleOcrInternal({
      allowNetworkInit:true
    });

    bar.style.width='96%';

    await cache.put(
      OCR_OFFLINE_PACK.readyKey,
      new Response(
        JSON.stringify({
          version:OCR_OFFLINE_PACK.version,
          readyAt:new Date().toISOString()
        }),
        {
          headers:{
            'Content-Type':'application/json'
          }
        }
      )
    );

    bar.style.width='100%';

    status.className='ocr-offline-status ok';
    status.textContent =
      '✅ OCR 離線包已準備完成。之後會優先從手機快取讀取。';

    btn.textContent='重新檢查';

    setTimeout(() => {
      progress.classList.add('hidden');
      bar.style.width='0';
    },900);

  } catch(e) {
    console.error(e);

    status.className='ocr-offline-status err';
    status.textContent =
      'OCR 離線包下載失敗：' + e.message;

    btn.textContent=oldText;

  } finally {
    btn.disabled=false;
  }
}

    textDetThresh:0.25,

  });

      .filter(Boolean)

function paddleItemsToDebugText(items) {

  return items.map((x,i) => {

async function runGeneralOcr(canvas, logger, langs = 'eng') {
  return Tesseract.recognize(
    canvas,
    langs,
    {
      logger
    }
  );
}

function collectGeneralDateCandidates(ocrRuns) {
  const voteMap = new Map();

  for (const run of ocrRuns) {
    const normalized = normalizeOcrText(run.text);
    const candidates = extractDateCandidates(normalized);

    for (const c of candidates) {
      if (!voteMap.has(c.iso)) {
        voteMap.set(c.iso, {
          iso:c.iso,
          votes:0,
          score:0,
          sources:[],
          notes:[],
          formats:[]
        });
      }

      const item = voteMap.get(c.iso);
      item.votes += 1;
      item.score += Number(c.score || 0) + 3;
      item.sources.push(run.name);

      if (c.note && !item.notes.includes(c.note)) {
        item.notes.push(c.note);
      }

      if (c.format && !item.formats.includes(c.format)) {
        item.formats.push(c.format);
      }
    }
  }

  return [...voteMap.values()]
    .sort((a,b) =>
      b.score - a.score ||
      b.votes - a.votes ||
      a.iso.localeCompare(b.iso)
    );
}

function mergeDateVotes(...voteLists) {
  const map = new Map();

  for (const list of voteLists) {
    for (const v of (list || [])) {
      if (!map.has(v.iso)) {
        map.set(v.iso,{
          iso:v.iso,
          votes:0,
          score:0,
          sources:[],
          notes:[],
          formats:[]
        });
      }

      const x = map.get(v.iso);
      x.votes += Number(v.votes || 0);
      x.score += Number(v.score || 0);
      x.sources.push(...(v.sources || []));

      for (const note of (v.notes || [])) {
        if (note && !x.notes.includes(note)) {
          x.notes.push(note);
        }
      }

      for (const format of (v.formats || [])) {
        if (format && !x.formats.includes(format)) {
          x.formats.push(format);
        }
      }
    }
  }

  return [...map.values()]
    .sort((a,b) =>
      b.score - a.score ||
      b.votes - a.votes ||
      a.iso.localeCompare(b.iso)
    );
}

async function runDateOcr(canvas, logger, psm = '7') {
  window.__dateOcrLogger =
    typeof logger === 'function' ? logger : null;

  const worker = await getDateOcrWorker(logger);

  await worker.setParameters({
    tessedit_char_whitelist: '0123456789./-',
    tessedit_pageseg_mode: String(psm),
    preserve_interword_spaces: '0'
  });

  return worker.recognize(canvas);
}

function sharpenCanvas(source) {
  const out = document.createElement('canvas');
  out.width = source.width;
  out.height = source.height;

  const ctx = out.getContext('2d');
  ctx.drawImage(source,0,0);

  const img = ctx.getImageData(0,0,out.width,out.height);
  const srcData = new Uint8ClampedArray(img.data);
  const d = img.data;
  const w = out.width;
  const h = out.height;

  const k = [
     0,-1, 0,
    -1, 5,-1,
     0,-1, 0
  ];

  for (let y=1;y<h-1;y++) {
    for (let x=1;x<w-1;x++) {
      for (let c=0;c<3;c++) {
        let sum=0;
        let ki=0;

        for (let yy=-1;yy<=1;yy++) {
          for (let xx=-1;xx<=1;xx++) {
            const idx=((y+yy)*w+(x+xx))*4+c;
            sum += srcData[idx]*k[ki++];
          }
        }

        const i=(y*w+x)*4+c;
        d[i]=Math.max(0,Math.min(255,sum));
      }
    }
  }

  ctx.putImageData(img,0,0);
  return out;
}

function nearestUpscaleCanvas(source, factor = 6) {
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(source.width * factor));
  out.height = Math.max(1, Math.round(source.height * factor));

  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(source,0,0,out.width,out.height);

  return out;
}



function showOcrDebugCanvases(items) {
  const grid = $('ocrDebugGrid');
  const details = $('ocrDebugDetails');
  if (!grid || !details) return;

  grid.innerHTML = '';

  for (const item of items) {
    if (!item?.canvas) continue;

    const card = document.createElement('div');
    card.className = 'ocr-debug-card';

    const label = document.createElement('div');
    label.className = 'small';
    label.textContent = item.name || '預覽';

    const preview = document.createElement('canvas');
    preview.width = item.canvas.width;
    preview.height = item.canvas.height;

    const ctx = preview.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,preview.width,preview.height);
    ctx.drawImage(item.canvas,0,0);

    card.appendChild(label);
    card.appendChild(preview);
    grid.appendChild(card);
  }

  details.open = true;
}

function addOcrPadding(source, padRatio = 0.14) {
  const padX = Math.max(12, Math.round(source.width * padRatio));
  const padY = Math.max(10, Math.round(source.height * padRatio));

  const out = document.createElement('canvas');
  out.width = source.width + padX * 2;
  out.height = source.height + padY * 2;

  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,out.width,out.height);
  ctx.drawImage(source,padX,padY);

  return out;
}

function gentleDateVariants(sourceCanvas) {
  const padded = addOcrPadding(sourceCanvas,0.14);
  const variants = [];

  // 平滑放大：一般印刷字比較適合
  const smooth4 = upscaleCanvas(padded,4);
  variants.push({
    name:'平滑原圖 ×4',
    canvas:smooth4,
    psm:'7'
  });

  variants.push({
    name:'平滑灰階 ×4',
    canvas:preprocessCanvas(smooth4,'gray'),
    psm:'7'
  });

  // 像素放大：保留點陣噴碼的原始點結構
  const pixel6 = nearestUpscaleCanvas(padded,6);
  variants.push({
    name:'像素原圖 ×6',
    canvas:pixel6,
    psm:'13'
  });

  variants.push({
    name:'像素灰階 ×6',
    canvas:preprocessCanvas(pixel6,'gray'),
    psm:'13'
  });

  variants.push({
    name:'輕微銳化 ×6',
    canvas:sharpenCanvas(pixel6),
    psm:'7'
  });

  return variants;
}

function cropCanvasByRatio(source, x0, y0, x1, y1) {
  const sx = Math.max(0, Math.floor(source.width * x0));
  const sy = Math.max(0, Math.floor(source.height * y0));
  const sw = Math.max(1, Math.floor(source.width * (x1 - x0)));
  const sh = Math.max(1, Math.floor(source.height * (y1 - y0)));

  const out = document.createElement('canvas');
  out.width = sw;
  out.height = sh;

  out.getContext('2d').drawImage(
    source,
    sx, sy, sw, sh,
    0, 0, sw, sh
  );

  return out;
}

function detectIncompleteYmd(text) {
  const t = normalizeOcrText(text);

  const m = t.match(
    /(?:^|[^0-9])(\d{1,3})[./-](\d{1,2})[./-](\d{1,2})(?:$|[^0-9])/
  );

  if (!m) return null;

  const yearToken = m[1];
  const month = Number(m[2]);
  const day = Number(m[3]);

  if (
    month < 1 || month > 12 ||
    day < 1 || day > 31
  ) return null;

  if (yearToken.length >= 4) return null;

  return {
    yearToken,
    month,
    day
  };
}

async function runYearRecovery(sourceCanvas, logger) {
  // 框選內容通常是單行日期，因此左半部優先視為年份區域。
  // 留一點餘量避免把第 4 位年份切掉。
  const yearCropRaw = cropCanvasByRatio(
    sourceCanvas,
    0.00, 0.05,
    0.52, 0.95
  );

  const yearCrop = addOcrPadding(yearCropRaw,0.20);

  const variants = [
    {
      name:'年份原圖 ×6',
      canvas:nearestUpscaleCanvas(yearCrop,6),
      psm:'7'
    },
    {
      name:'年份原圖 ×8',
      canvas:nearestUpscaleCanvas(yearCrop,8),
      psm:'8'
    },
    {
      name:'年份灰階 ×8',
      canvas:preprocessCanvas(
        nearestUpscaleCanvas(yearCrop,8),
        'gray'
      ),
      psm:'8'
    },
    {
      name:'年份銳化 ×8',
      canvas:sharpenCanvas(
        nearestUpscaleCanvas(yearCrop,8)
      ),
      psm:'13'
    }
  ];

  window.__lastYearRecoveryDebug = [
    { name:'年份裁切原圖', canvas:yearCropRaw },
    ...variants
  ];

  const yearVotes = new Map();
  const raw = [];

  for (let i=0;i<variants.length;i++) {
    const worker = await getDateOcrWorker(logger);

    await worker.setParameters({
      tessedit_char_whitelist:'0123456789',
      tessedit_pageseg_mode:variants[i].psm,
      preserve_interword_spaces:'0'
    });

    const result = await worker.recognize(
      variants[i].canvas
    );

    const cleaned = String(result.data.text || '')
      .replace(/\D/g,'')
      .trim();

    raw.push({
      name:variants[i].name,
      text:cleaned
    });

    const matches = cleaned.match(/20\d{2}/g) || [];

    for (const y of matches) {
      yearVotes.set(
        y,
        (yearVotes.get(y) || 0) + 1
      );
    }
  }

  // Restore normal full-date worker config.
  const worker = await getDateOcrWorker(logger);
  await worker.setParameters({
    tessedit_char_whitelist:'0123456789./-',
    tessedit_pageseg_mode:'7',
    preserve_interword_spaces:'0'
  });

  return {
    votes:[...yearVotes.entries()]
      .sort((a,b)=>b[1]-a[1]),
    raw
  };
}


function normalizeOcrText(s) {
  return String(s || '')
    .replace(/[，,]/g,'.')
    .replace(/[：:]/g,'.')
    .replace(/\s+/g,' ')
    .trim();
}

function sanitizeDateOcrText(s) {
  // 日期專用 OCR 最後再做一道保險：
  // 僅保留數字、日期分隔符與空白 / 換行。
  return String(s || '')
    .replace(/[^0-9./\-\s]/g,'')
    .replace(/[ \t]+/g,' ')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function collectDateVotes(ocrRuns) {
  const voteMap = new Map();

  for (const run of ocrRuns) {
    const normalized = normalizeOcrText(run.text);
    const candidates = extractDateCandidates(
      normalized,
      { strictOcrYear: true }
    );

    for (const c of candidates) {
      if (!voteMap.has(c.iso)) {
        voteMap.set(c.iso, {
          iso:c.iso,
          votes:0,
          score:0,
          sources:[],
          notes:[],
          formats:[]
        });
      }

      const item = voteMap.get(c.iso);
      item.votes += 1;
      item.score += Number(c.score || 0);
      item.sources.push(run.name);

      if (c.note && !item.notes.includes(c.note)) {
        item.notes.push(c.note);
      }

      if (c.format && !item.formats.includes(c.format)) {
        item.formats.push(c.format);
      }
    }
  }

  return [...voteMap.values()]
    .sort((a,b) =>
      b.score - a.score ||
      b.votes - a.votes ||
      a.iso.localeCompare(b.iso)
    );
}

function findPartialDateHints(ocrRuns) {
  const monthDayVotes = new Map();
  const yearVotes = new Map();
  const incompleteYearTokens = new Map();

  const monthMap = {
    JAN:1,JANUARY:1,
    FEB:2,FEBRUARY:2,
    MAR:3,MARCH:3,
    APR:4,APRIL:4,
    MAY:5,
    JUN:6,JUNE:6,
    JUL:7,JULY:7,
    AUG:8,AUGUST:8,
    SEP:9,SEPT:9,SEPTEMBER:9,
    OCT:10,OCTOBER:10,
    NOV:11,NOVEMBER:11,
    DEC:12,DECEMBER:12
  };

  for (const run of ocrRuns) {
    const t = normalizeOcrText(run.text);
    let m;

    const fullLikeRe =
      /(?:^|[^0-9])(\d{1,4})[./-](\d{1,2})[./-](\d{1,2})(?:$|[^0-9])/g;

    while ((m = fullLikeRe.exec(t))) {
      const yToken = m[1];
      const mo = Number(m[2]);
      const d = Number(m[3]);

      if (mo < 1 || mo > 12 || d < 1 || d > 31) continue;

      const mdKey =
        String(mo).padStart(2,'0') + '-' +
        String(d).padStart(2,'0');

      monthDayVotes.set(
        mdKey,
        (monthDayVotes.get(mdKey) || 0) + 1
      );

      if (yToken.length === 4) {
        const y = Number(yToken);

        if (y >= 2000 && y <= 2100) {
          yearVotes.set(
            String(y),
            (yearVotes.get(String(y)) || 0) + 1
          );
        }
      } else {
        incompleteYearTokens.set(
          yToken,
          (incompleteYearTokens.get(yToken) || 0) + 1
        );
      }
    }

    const mdRe =
      /(?:^|[^0-9])(\d{1,2})[./-](\d{1,2})(?:$|[^0-9])/g;

    while ((m = mdRe.exec(t))) {
      const mo = Number(m[1]);
      const d = Number(m[2]);

      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        const key =
          String(mo).padStart(2,'0') + '-' +
          String(d).padStart(2,'0');

        monthDayVotes.set(
          key,
          (monthDayVotes.get(key) || 0) + 1
        );
      }
    }

    // 例如 03 MAR 15:31：有月日但沒有年份，不硬猜年份。
    const englishMdRe =
      /\b(\d{1,2})\s*[-./ ]\s*(JAN(?:UARY)?|FEB(?:RUARY)?|MAR(?:CH)?|APR(?:IL)?|MAY|JUN(?:E)?|JUL(?:Y)?|AUG(?:UST)?|SEP(?:T(?:EMBER)?)?|OCT(?:OBER)?|NOV(?:EMBER)?|DEC(?:EMBER)?)\b/gi;

    while ((m = englishMdRe.exec(t))) {
      const d = Number(m[1]);
      const mo = monthMap[m[2].toUpperCase()];

      if (mo && d >= 1 && d <= 31) {
        const key =
          String(mo).padStart(2,'0') + '-' +
          String(d).padStart(2,'0');

        monthDayVotes.set(
          key,
          (monthDayVotes.get(key) || 0) + 1
        );
      }
    }

    const yRe = /\b(20\d{2})\b/g;

    while ((m = yRe.exec(t))) {
      const y = Number(m[1]);

      if (y >= 2000 && y <= 2100) {
        yearVotes.set(
          String(y),
          (yearVotes.get(String(y)) || 0) + 1
        );
      }
    }
  }

  const bestMonthDay = [...monthDayVotes.entries()]
    .sort((a,b)=>b[1]-a[1])[0] || null;

  const years = [...yearVotes.entries()]
    .sort((a,b)=>b[1]-a[1]);

  const incompleteYears = [...incompleteYearTokens.entries()]
    .sort((a,b)=>b[1]-a[1]);

  return {
    bestMonthDay,
    years,
    incompleteYears
  };
}

function buildOcrCandidateUi(votes, ocrRuns) {
  const box = $('ocrCandidateList');

  if (!votes.length) {
    const hints = findPartialDateHints(ocrRuns);

    if (hints.bestMonthDay) {
      const [md,count] = hints.bestMonthDay;

      let html = `
        <div class="small" style="margin-bottom:8px">
          OCR 有辨識到月 / 日：
          <b>${md}</b>
          （${count} 次），但沒有可靠的完整年份。
        </div>
        <div class="small" style="color:#9a6414">
          不會自動猜年份，請人工確認年份後再輸入。
        </div>
      `;

      if (hints.years.length) {
        html += `
          <div class="small" style="margin-top:6px">
            另外辨識到的四位年份：
            ${hints.years.slice(0,5)
              .map(([y,n]) => `${y}（${n} 次）`)
              .join('、')}
          </div>
        `;
      }

      if (hints.incompleteYears?.length) {
        html += `
          <div class="small" style="margin-top:6px;color:#b63737">
            年份辨識不完整：
            ${hints.incompleteYears.slice(0,5)
              .map(([y,n]) => `${y}（${n} 次）`)
              .join('、')}
          </div>
        `;
      }

      box.innerHTML = html;
    } else {
      box.innerHTML =
        '<div class="small">沒有找到可信的日期候選。</div>';
    }

    $('ocrApplyBtn').disabled = true;
    return;
  }

  ocrCandidates = votes.map(v => ({
    iso:v.iso,
    source:v.sources.join(' / '),
    score:v.score,
    votes:v.votes,
    notes:v.notes || [],
    formats:v.formats || []
  }));

  const topScore = Number(votes[0].score || 0);
  const secondScore = Number(votes[1]?.score || -999);
  const highConfidence =
    topScore >= 12 &&
    (
      votes.length === 1 ||
      topScore - secondScore >= 4
    );

  box.innerHTML = ocrCandidates.map((c,i) => {
    let level = 'low';
    let label = '低';

    if (
      c.score >= 18 ||
      c.votes >= 2
    ) {
      level='high';
      label='高';
    } else if (c.score >= 10) {
      level='mid';
      label='中';
    }

    const noteHtml = (c.notes || [])
      .map(note =>
        `<div class="small" style="margin-top:3px;color:#9a6414">${escapeHtml(note)}</div>`
      )
      .join('');

    return `
      <label class="ocr-candidate">
        <input
          type="radio"
          name="ocrCandidate"
          value="${c.iso}"
          ${i===0?'checked':''}
        >
        <div>
          <b>${c.iso}</b>
          <div class="small">
            ${escapeHtml(c.source || '')}
          </div>
          ${noteHtml}
          <div class="ocr-confidence ${level}">
            可信度：${label}
          </div>
        </div>
      </label>
    `;
  }).join('');

  $('ocrApplyBtn').disabled = false;

  const ambiguous = ocrCandidates.some(c =>
    (c.notes || []).some(n => n.includes('格式有歧義'))
  );

  if (ambiguous) {
    setStatus(
      'ocrStatus',
      '日期格式有歧義，已列出所有合法候選，請確認後再套用。',
      'err'
    );
  } else if (!highConfidence && votes.length > 1) {
    setStatus(
      'ocrStatus',
      '辨識到多個日期候選，請人工確認後再套用。',
      'err'
    );
  }
}

$('ocrStartBtn').onclick = async () => {
  if (!ocrImage) return;

  const btn = $('ocrStartBtn');

  try {
    setBusy(btn,true,'辨識中…','快速辨識');
    show('ocrAdvancedBtn',false);
    $('ocrApplyBtn').disabled=true;
    show('ocrResults',false);
    show('ocrProgressBox',true);
    $('ocrProgressBar').style.width='5%';

    const base = makeOcrSourceCanvas();

    let paddleResult = null;
    let paddleError = null;
    let paddleVotes = [];

    // --------------------------------------------------
    // 1. PP-OCRv6：主力辨識
    // --------------------------------------------------
    try {
      setStatus(
        'ocrStatus',
        paddleOcrInstance
          ? '正在使用 PP-OCRv6 辨識日期…'
          : '第一次使用 PP-OCRv6，正在載入模型並辨識…'
      );

      $('ocrProgressBar').style.width='20%';

      paddleResult = await runPaddleOcr(base);

      $('ocrProgressBar').style.width='72%';

      paddleVotes = collectGeneralDateCandidates([{
        name:'PP-OCRv6',
        text:paddleResult.text
      }]);

    } catch (e) {
      paddleError = e;
      console.warn('PP-OCRv6 failed:',e);
    }

    // --------------------------------------------------
    // 2. 找不到日期，或 PP-OCR 無法執行時才跑 Tesseract
    // --------------------------------------------------
    let tessText = '';
    let tessVotes = [];

    if (!paddleVotes.length) {
      setStatus(
        'ocrStatus',
        paddleError
          ? 'PP-OCRv6 無法執行，正在改用 Tesseract 備援…'
          : 'PP-OCRv6 沒找到完整日期，正在用 Tesseract 再確認…'
      );

      $('ocrProgressBar').style.width='75%';

      const tessCanvas = upscaleCanvas(
        addOcrPadding(base,0.10),
        3
      );

      const tessResult = await runGeneralOcr(
        tessCanvas,
        m => {
          if (
            m.status==='recognizing text' &&
            typeof m.progress==='number'
          ) {
            $('ocrProgressBar').style.width =
              (75 + m.progress*25).toFixed(0) + '%';
          }
        },
        'eng'
      );

      tessText = tessResult.data.text || '';

      tessVotes = collectGeneralDateCandidates([{
        name:'Tesseract 備援',
        text:tessText
      }]);
    }

    const votes = mergeDateVotes(
      paddleVotes,
      tessVotes
    );

    $('ocrProgressBar').style.width='100%';

    let raw = '';

    if (paddleResult) {
      raw +=
        '[PP-OCRv6]\n' +
        paddleItemsToDebugText(paddleResult.items);
    } else {
      raw +=
        '[PP-OCRv6]\n' +
        '執行失敗：' +

    }

        'ocrStatus',

      'ocrStatus',

  } finally {

      btn,
      false,

};
